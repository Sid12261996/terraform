# GitHub Actions Workflow: Terraform Plan
# Runs on pull requests to validate Terraform changes
# Posts plan output as PR comment

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '!README.md'
      - '!docs/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write

env:
  TF_VERSION: "1.6.6"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Run terraform fmt check
        id: fmt
        run: |
          terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Report format issues
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::Terraform formatting issues found. Run 'terraform fmt -recursive' locally."
          exit 1

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Initialize Terraform
        run: |
          terraform init -backend=false
        env:
          OCI_REGION: ${{ vars.OCI_REGION }}

      - name: Validate Terraform configuration
        run: |
          terraform validate

  plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    environment: dev
    concurrency:
      group: terraform-plan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure OCI Authentication
        id: oci-auth
        run: |
          # Support both API key and instance principal auth
          if [ -n "${{ secrets.OCI_USER_OCID }}" ]; then
            echo "Using API key authentication"
            cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ vars.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
            echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem
          else
            echo "Using instance principal authentication (running in OCI)"
          fi

      - name: Initialize Terraform with Backend
        run: |
          terraform init \
            -backend-config="bucket_name=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.TF_STATE_NAMESPACE }}" \
            -backend-config="region=${{ vars.OCI_REGION }}" \
            -backend-config="object_name=terraform.tfstate"
        env:
          OCI_REGION: ${{ vars.OCI_REGION }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=dev.tfvars \
            -var="oci_region=${{ vars.OCI_REGION }}" \
            -var="oci_tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" \
            -var="oci_user_ocid=${{ secrets.OCI_USER_OCID }}" \
            -var="oci_fingerprint=${{ secrets.OCI_FINGERPRINT }}" \
            -var="oci_private_key_path=~/.oci/oci_api_key.pem" \
            -out=tfplan.binary
        continue-on-error: true

      - name: Convert Plan to JSON
        if: steps.plan.outcome == 'success'
        run: |
          terraform show -json tfplan.binary > tfplan.json

      - name: Generate Plan Summary
        if: steps.plan.outcome == 'success'
        id: plan-summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('tfplan.json', 'utf8'));
            
            let adds = 0, changes = 0, destroys = 0;
            if (plan.resource_changes) {
              for (const rc of plan.resource_changes) {
                if (rc.change.actions.includes('create')) adds++;
                else if (rc.change.actions.includes('update')) changes++;
                else if (rc.change.actions.includes('delete')) destroys++;
              }
            }
            
            let summary = `## Terraform Plan Summary\n\n`;
            summary += `| Action | Count |\n|--------|-------|\n`;
            summary += `| Create | ${adds} |\n`;
            summary += `| Update | ${changes} |\n`;
            summary += `| Destroy | ${destroys} |\n\n`;
            
            if (adds + changes + destroys === 0) {
              summary += "✅ No changes. Infrastructure is up to date.";
            } else {
              summary += `**Total: ${adds + changes + destroys} changes**`;
            }
            
            core.setOutput('summary', summary);
            core.setOutput('has-changes', (adds + changes + destroys > 0).toString());

      - name: Post Plan Comment on PR
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PLAN_SUMMARY: ${{ steps.plan-summary.outputs.summary }}
        with:
          script: |
            const summary = process.env.PLAN_SUMMARY || 'Plan summary unavailable';
            
            const body = `${summary}\n\n---\n*Generated by GitHub Actions on ${new Date().toISOString()}*`;
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            
            const existingComment = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('Terraform Plan Summary')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }

      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            tfplan.binary
            tfplan.json
          retention-days: 30

      - name: Fail on Plan Errors
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::Terraform plan failed. Check logs above."
          exit 1

  policy-check:
    name: Policy Check (Checkov)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          skip_check: CKV_OCI_1,CKV_OCI_2  # Skip specific checks if needed
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov